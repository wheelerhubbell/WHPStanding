name: Establish WHP Standing LIVE authority
on:
  push:
    branches: [standing-v1-propagation]
    paths: [.github/workflows/establish-live-authority.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whp-standing-production-authority
  cancel-in-progress: false
jobs:
  establish:
    if: github.ref == 'refs/heads/standing-v1-propagation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-verification.txt
      - run: npm ci --include=optional --ignore-scripts
      - run: bash scripts/build-cold-sandbox.sh
      - name: Verify inherited proof and canonical authority tests before production mutation
        run: npm run verify
      - name: Establish authorized production authority with canonical primitives and isolated secret custody
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          AUTHORIZATION_TEXT: "I authorize establishment of Wheeler Hubbell Publishing’s production cryptographic root and issuer authority for WHP Standing v1."
        run: node scripts/establish-live-authority.mjs
      - name: Commit verified public identity and evidence only
        run: |
          if grep -Rq 'BEGIN .*PRIVATE KEY' evidence/live-authority public/authority; then
            echo 'PRIVATE_MATERIAL_IN_PUBLIC_OUTPUT'; exit 1
          fi
          git config user.name 'WHP Standing Authority Ceremony'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/live-authority public/authority
          git diff --cached --quiet || git commit -m 'Record independently verified WHP production root, profile ratification, and issuer authority'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Preserve public proof only; never upload key custody
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whp-standing-authority-proof-${{ github.run_id }}
          path: |
            evidence/live-authority/
            evidence/propagation-extension/
            evidence/cold-agent/
          retention-days: 90
