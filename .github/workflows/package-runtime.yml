name: Verify Netlify runtime package
on:
  push:
    branches: ['standing-v1-propagation']
    paths: ['.github/workflows/package-runtime.yml', 'netlify.toml', 'netlify/functions/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked application dependencies and pinned official Netlify bundler
        run: |
          npm ci --include=optional --ignore-scripts
          npm install --prefix .runtime/package-tools --ignore-scripts --save-exact @netlify/zip-it-and-ship-it@15.5.1
      - name: Read authoritative Netlify configuration
        run: |
          mkdir -p evidence/netlify-package
          python3 - <<'PY'
          import tomllib,json,pathlib
          pathlib.Path('.runtime/netlify-config.json').write_text(json.dumps(tomllib.loads(pathlib.Path('netlify.toml').read_text())))
          PY
      - name: Bundle and execute packaged runtime with no authority or production configuration
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';import {resolve,join,relative} from 'node:path';import {readFile,writeFile,readdir,mkdir,stat} from 'node:fs/promises';import {spawnSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const require=createRequire(resolve('.runtime/package-tools/package.json'));
          const {zipFunctions}=await import(require.resolve('@netlify/zip-it-and-ship-it'));
          const source=process.cwd(),cfg=JSON.parse(await readFile('.runtime/netlify-config.json','utf8')),f=cfg.functions;
          const archives=await zipFunctions(cfg.build.functions,'.runtime/netlify-output',{archiveFormat:'none',basePath:source,config:{'*':{nodeBundler:f.node_bundler,nodeVersion:cfg.build.environment.NODE_VERSION,externalNodeModules:f.external_node_modules,includedFiles:f.included_files}},manifest:resolve('evidence/netlify-package/manifest.json')});
          console.log(JSON.stringify(archives,null,2));assert.equal(archives.length,1);assert.equal(archives[0].runtimeAPIVersion,2);
          const root=resolve(archives[0].path);assert((await stat(root)).isDirectory());
          async function walk(dir){const out=[];for(const e of await readdir(dir,{withFileTypes:true})){if(e.name==='node_modules')continue;const p=join(dir,e.name);if(e.isDirectory())out.push(...await walk(p));else out.push(p);}return out;}
          const files=await walk(root);await writeFile('evidence/netlify-package/files.json',JSON.stringify(files.map(p=>relative(root,p)),null,2)+'\n');
          const entries=files.filter(p=>p.endsWith('/standing.mjs'));const entry=entries.find(p=>relative(root,p)==='standing.mjs')??(entries.length===1?entries[0]:null);assert(entry,'PACKAGED_ENTRY_NOT_UNAMBIGUOUS');
          const script=`import assert from 'node:assert/strict';import {pathToFileURL} from 'node:url';const m=await import(pathToFileURL(process.argv[1]).href);assert.equal(typeof m.default,'function');const r=await m.default(new Request('https://unconfigured.invalid/v1/contract'));assert.equal(r.status,503);assert.equal((await r.json()).error.code,'SERVICE_UNAVAILABLE');console.log(JSON.stringify({entry_imported:true,unconfigured_authority_refused:true,status:503}));`;
          const child=spawnSync(process.execPath,['--input-type=module','-e',script,entry],{cwd:root,env:{PATH:process.env.PATH},encoding:'utf8',timeout:30000});
          await writeFile('evidence/netlify-package/runtime.stdout.txt',child.stdout??'');await writeFile('evidence/netlify-package/runtime.stderr.txt',child.stderr??'');assert.equal(child.status,0,(child.stdout??'')+(child.stderr??''));
          const verifier=JSON.parse(await readFile('public/verifier-manifest.json','utf8'));const asset='public'+verifier.path;
          const original=await readFile(asset),packaged=await readFile(join(root,asset));assert(original.equals(packaged));assert.equal(createHash('sha256').update(packaged).digest('hex'),verifier.sha256);
          const report={completed_at:new Date().toISOString(),source_commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,bundler:'@netlify/zip-it-and-ship-it@15.5.1',actual_netlify_bundling_executed:true,runtime_api_version:archives[0].runtimeAPIVersion,packaged_application_handler_imported:true,unconfigured_runtime_refused:true,content_addressed_verifier_packaged_byte_identically:true,production_configuration_present:false,deployed:false,live_authority_verified:false,sold:false,issued:false};await writeFile('evidence/netlify-package/report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          JS
      - name: Preserve execution evidence and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whp-standing-netlify-package-${{ github.run_id }}
          path: |
            evidence/netlify-package/
            .runtime/netlify-output/
          include-hidden-files: true
          retention-days: 90
