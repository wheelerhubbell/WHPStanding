name: Verify first-public WHP Standing v1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-test-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whp_test
          POSTGRES_PASSWORD: whp_test_ephemeral
          POSTGRES_DB: whp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U whp_test -d whp_test" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-verification.txt
      - run: npm ci --include=optional --ignore-scripts
      - run: bash scripts/build-cold-sandbox.sh
      - run: npm run verify
      - name: Isolated PostgreSQL proof, never production storage
        env:
          WHP_TEST_POSTGRES_URL: postgresql://whp_test:whp_test_ephemeral@127.0.0.1:5432/whp_test
        run: node scripts/test-postgres.mjs
      - run: node scripts/finish-proof.mjs
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whp-standing-public-v1-${{ github.run_id }}
          path: evidence/public-v1/
          if-no-files-found: error
          retention-days: 90
      # No deployment, production credentials, real payment or LIVE issuance.
