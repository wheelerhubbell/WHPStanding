name: Verify WHP Standing source
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-verification.txt
      - name: Prepare isolated verifier when propagation source is present
        run: |
          if test -f scripts/build-cold-sandbox.sh; then
            bash scripts/build-cold-sandbox.sh
          fi
      - run: npm run verify
      - name: Preserve actual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whp-standing-source-verification-${{ github.run_id }}
          path: |
            evidence/verification.json
            evidence/propagation-extension/
            evidence/cold-agent/
          retention-days: 90
      # No deployment, real database access, real payment, or LIVE issuance.
