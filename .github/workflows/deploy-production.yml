name: Deploy and verify WHP Standing production
on:
  push:
    branches: [standing-v1-propagation]
    paths: [.github/workflows/deploy-production.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whp-standing-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --include=optional --ignore-scripts
      - name: Configure established authority and existing Free-plan dependencies
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node scripts/configure-production.mjs
          node scripts/refresh-live-status.mjs
      - name: Require verified configuration and install official deployment tooling
        run: |
          node --input-type=module -e "import fs from 'node:fs';if(!JSON.parse(fs.readFileSync('evidence/production/configuration.json')).configuration_ready_for_deployment)process.exit(1)"
          npm install --prefix .runtime/deploy-tools netlify-cli
      - name: Deploy exact release branch to canonical Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 914e2d6d-ec82-4b03-aa58-785fcf3b453b
        run: |
          mkdir -p evidence/production
          cat > /tmp/whp-http-diagnostic.cjs <<'JS'
          const https = require('node:https');
          const original = https.request;
          https.request = function(...args) {
            const req = original.apply(this,args);
            req.on('response',res=>{
              if(res.statusCode>=400) process.stderr.write(JSON.stringify({http_status:res.statusCode,method:req.method,host:req.host,path:req.path.split('?')[0]})+'\n');
            });
            return req;
          };
          JS
          export NODE_OPTIONS="--require=/tmp/whp-http-diagnostic.cjs"
          .runtime/deploy-tools/node_modules/.bin/netlify deploy --prod --build --dir public --functions netlify/functions --json > evidence/production/deploy.json
      - name: Verify public authority, discovery, and real unpaid boundary
        run: |
          export WHP_ROOT_PIN="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('public/authority/root.json')).root_pin)")"
          node scripts/probe-public-boundary.mjs
      - name: Preserve actual public evidence
        if: always()
        run: |
          mkdir -p evidence/production evidence/public-service
          if grep -Rq 'BEGIN .*PRIVATE KEY\|postgresql://' evidence/production evidence/public-service; then exit 1; fi
          git config user.name 'WHP Standing Production'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/production evidence/public-service evidence/live-authority public/authority
          git diff --cached --quiet || git commit -m 'Record production deployment and actual public boundary evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-proof-${{ github.run_id }}
          path: |
            evidence/production/
            evidence/public-service/
