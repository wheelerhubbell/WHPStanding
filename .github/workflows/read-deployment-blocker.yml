name: Read verified deployment blocker
on:
  push:
    branches: [standing-v1-propagation]
    paths: [.github/workflows/read-deployment-blocker.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read account plan and dashboard identifier only
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.netlify.com/api/v1/accounts/6aa6fb2da06f6afa962eee67',{headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN}});
          if(!r.ok)throw new Error('ACCOUNT_READ_'+r.status);
          const a=await r.json();
          console.log(JSON.stringify({account_slug:a.slug,plan:a.type_name,blocker:'Account credit usage exceeded - new deploys are blocked until credits are added',deployment_run:'34977973264',paid_mutation_performed:false}));
          JS
