name: Rebuild WHP Standing canonical ZIP
on:
  push:
    branches: [standing-v1-propagation]
    paths:
      - POST-ZIP-CONTINUITY.md
      - .github/workflows/rebuild-canonical-zip.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whp-standing-canonical-zip
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build amended continuity archive without recursive old ZIP
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          rm -f WHP-Standing-v1-candidate-1.zip WHP-Standing-v1-candidate-1.zip.sha256
          rm -rf /tmp/WHP-Standing-v1-amended
          mkdir -p /tmp/WHP-Standing-v1-amended
          git archive --format=tar HEAD | tar -x -C /tmp/WHP-Standing-v1-amended
          rm -f /tmp/WHP-Standing-v1-amended/WHP-Standing-v1-candidate-1.zip /tmp/WHP-Standing-v1-amended/WHP-Standing-v1-candidate-1.zip.sha256
          cat > /tmp/WHP-Standing-v1-amended/AMENDED-ARCHIVE-IDENTITY.txt <<EOF
          WHP Standing v1 amended continuity archive
          Original ZIP first added: 12fd5beb2564f90a57079e598b0dbddf09dfcada
          Known clean verified checkpoint: 1cc06944fc821dbb182ecdec826b85da949cabce
          Amended source commit: ${SOURCE_SHA}
          Built UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Purpose: preserve all repository source, evidence, production authority, provider findings, deployment work, and post-ZIP continuity knowledge available at the amended source commit.
          Private keys are not included.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/WHP-Standing-v1-amended')
          marker=b'-----BEGIN '+b'PRIVATE KEY-----'
          hits=[]
          for p in root.rglob('*'):
              if p.is_file() and p.stat().st_size < 20_000_000:
                  try:
                      if marker in p.read_bytes(): hits.append(str(p.relative_to(root)))
                  except OSError: pass
          if hits: raise SystemExit('PRIVATE_KEY_FOUND '+','.join(hits))
          PY
          (cd /tmp/WHP-Standing-v1-amended && find . -type f ! -name AMENDED-FILES.sha256 -print0 | sort -z | xargs -0 sha256sum > AMENDED-FILES.sha256)
          (cd /tmp/WHP-Standing-v1-amended && zip -q -r "$GITHUB_WORKSPACE/WHP-Standing-v1-candidate-1.zip" .)
          sha256sum WHP-Standing-v1-candidate-1.zip > WHP-Standing-v1-candidate-1.zip.sha256
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('WHP-Standing-v1-candidate-1.zip')
          bad=z.testzip()
          if bad: raise SystemExit('CORRUPT_ZIP_MEMBER '+bad)
          names={n.removeprefix('./') for n in z.namelist()}
          required={'POST-ZIP-CONTINUITY.md','evidence/live-authority/verification.json','evidence/production/deployment-blocker.json','evidence/production/credit-inspection.json','public/authority/root.json','AMENDED-ARCHIVE-IDENTITY.txt','AMENDED-FILES.sha256'}
          missing=required-names
          if missing: raise SystemExit('MISSING_REQUIRED '+','.join(sorted(missing)))
          if 'WHP-Standing-v1-candidate-1.zip' in names: raise SystemExit('RECURSIVE_OLD_ZIP_PRESENT')
          print('AMENDED_ARCHIVE_VERIFIED',len(names),'members')
          PY
      - name: Replace old ZIP with amended continuity archive
        run: |
          git config user.name 'WHP Standing Archive'
          git config user.email 'actions@users.noreply.github.com'
          git add WHP-Standing-v1-candidate-1.zip WHP-Standing-v1-candidate-1.zip.sha256
          git commit -m 'Amend WHP Standing ZIP with complete post-candidate source, authority, evidence, and production knowledge'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: WHP-Standing-v1-amended-continuity
          path: |
            WHP-Standing-v1-candidate-1.zip
            WHP-Standing-v1-candidate-1.zip.sha256
          retention-days: 90
