name: Complete WHP Standing source import
on:
  push:
    paths:
      - '.github/workflows/import-runtime.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand exact uploaded candidate
        run: |
          unzip -o WHP-Standing-v1-candidate-1.zip
          rm WHP-Standing-v1-candidate-1.zip
      - name: Verify source before commit
        run: |
          npm test
          node scripts/check.mjs
      - name: Commit completed runtime
        run: |
          git config user.name 'WHP Standing Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete WHP Standing v1 candidate source import'
          git push
