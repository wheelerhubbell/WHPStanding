name: Complete WHP Standing source import
on:
  push:
    paths:
      - '.github/workflows/import-runtime.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Expand exact uploaded candidate
        run: unzip -o WHP-Standing-v1-candidate-1.zip
      - name: Verify exact candidate before promotion
        working-directory: whp-standing-v1
        run: |
          python -m pip install cryptography jsonschema
          npm test
          npm run verify
      - name: Promote verified candidate to repository root
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name whp-standing-v1 -exec rm -rf {} +
          cp -a whp-standing-v1/. .
          rm -rf whp-standing-v1
      - name: Commit completed runtime
        run: |
          git config user.name 'WHP Standing Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete WHP Standing v1 candidate source import'
          git push
