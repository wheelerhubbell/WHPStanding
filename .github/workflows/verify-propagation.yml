name: Verify and promote WHP Standing propagation extension
on:
  push:
    paths:
      - 'build-input/propagation-extension.json'
      - '.github/workflows/verify-propagation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whp-standing-propagation-promotion
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whp_test
          POSTGRES_PASSWORD: whp_test_ephemeral
          POSTGRES_DB: whp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact hash-checked source changes without rewriting recovered history
        run: |
          test -f build-input/propagation-extension.json
          python - <<'PY'
          import pathlib,json,hashlib,subprocess
          manifest=json.loads(pathlib.Path('build-input/propagation-extension.json').read_text())
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          for entry in manifest['files']:
              p=pathlib.Path(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ['.git','.github','evidence']
              current=digest(p)
              assert current in [entry['before'],entry['sha256']], 'Source conflict: '+str(p)
              if current==entry['sha256']:continue
              if 'diff' in entry:
                  subprocess.run(['git','apply','--whitespace=nowarn','-'],input=entry['diff'].encode(),check=True)
              elif 'content' in entry:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(entry['content'])
          for entry in manifest['files']:
              p=pathlib.Path(entry['path'])
              if 'copy_from' in entry:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(entry['copy_from']).read_bytes())
              assert digest(p)==entry['sha256'],'Post-apply hash mismatch: '+str(p)
          out=pathlib.Path('evidence/propagation-extension');out.mkdir(parents=True,exist_ok=True)
          (out/'source-identity.json').write_text(json.dumps({'recovered_candidate':manifest['recovered_candidate'],'files':[{k:v for k,v in e.items() if k in ['path','before','sha256']} for e in manifest['files']]},indent=2)+'\n')
          PY
      - name: Install pinned verification and PostgreSQL dependencies
        run: |
          python -m pip install -r requirements-verification.txt
          npm install --include=optional --ignore-scripts
      - name: Build generic independent verifier sandbox with no WHP source
        run: bash scripts/build-cold-sandbox.sh
      - name: Execute all original and additional tests; no skipped proof
        run: npm run verify
      - name: Execute real isolated PostgreSQL integration and separate-process retrieval
        env:
          WHP_TEST_POSTGRES_URL: postgresql://whp_test:whp_test_ephemeral@127.0.0.1:5432/whp_test
        run: node scripts/test-postgres.mjs
      - name: Preserve production authorization inspection already executed
        uses: actions/download-artifact@v4
        with:
          name: whp-standing-readiness-34961217519
          run-id: 34961217519
          github-token: ${{ github.token }}
          path: evidence/production-authorization/
      - name: Commit only verified source and actual execution evidence
        run: |
          python - <<'PY'
          import pathlib,json,os
          p=pathlib.Path('evidence/propagation-extension/verification.json');r=json.loads(p.read_text())
          db=json.loads(pathlib.Path('evidence/postgresql/report.json').read_text());assert db['all_passed'] and not db['production_database_accessed']
          r['postgresql_integration_tested']=True;r['postgresql_report']='evidence/postgresql/report.json';r['github_run_id']=os.environ['GITHUB_RUN_ID'];r['github_workflow_source_commit']=os.environ['GITHUB_SHA'];p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name 'WHP Standing Verification'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then echo 'Workflow edits require connected API'; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Implement signed Mark discovery and isolated propagation proof; preserve recovered candidate'
            git push origin HEAD:main
          fi
      - name: Preserve evidence even when a proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whp-standing-propagation-${{ github.run_id }}
          path: |
            evidence/propagation-extension/
            evidence/cold-agent/
            evidence/postgresql/
            evidence/production-authorization/
          retention-days: 90
